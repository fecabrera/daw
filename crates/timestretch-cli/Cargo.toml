[package]
name = "timestretch-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "BSD-2-Clause"
description = "Standalone three-engine time stretch and pitch comparison tool"

[[bin]]
name = "timestretch"
path = "src/main.rs"

[features]
default = ["rubberband-reference"]
rubberband-reference = ["dep:rubberband", "dep:rubberband-sys"]

[dependencies]
timestretch = { path = "../timestretch", version = "0.1.0" }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
hound = "3.5"
rubato = "0.16"
rubberband = { version = "=0.1.5", optional = true }
rubberband-sys = { version = "=0.1.4", optional = true }
tempfile = "3"
same-file = "1.0"

sha2.workspace = true

ctrlc = { version = "3.5", features = ["termination"] }
