[package]
name = "daw-project"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "BSD-2-Clause"

[dependencies]
audio-analysis.workspace = true
daw-plugin-host.workspace = true
daw-separation.workspace = true
daw-core.workspace = true
daw-media.workspace = true
daw-engine.workspace = true
hound.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"

[dev-dependencies]
daw-unit-core.workspace = true
symphonia = { workspace = true, features = ["mp3"] }
