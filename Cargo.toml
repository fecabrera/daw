[workspace]
resolver = "3"
exclude = ["vendor/charon-audio"]
members = ["crates/separation", "crates/saturator", "crates/bitcrusher", "crates/stereo-spread", "crates/direction-mixer", "crates/sampler", "crates/macro", "crates/lfo", "crates/amplitude", "crates/timestretch", "crates/timestretch-cli", "crates/unit-core", "crates/oscillator", "crates/envelope", "crates/equalizer", "crates/drive", "crates/auto-filter", "crates/filter", "crates/compressor", "crates/limiter", "crates/ott", "crates/core", "crates/media", "crates/engine", "crates/project", "crates/output", "crates/ui", "apps/desktop", "apps/cli"]
default-members = ["apps/desktop", "apps/cli"]

# Optimize shared DSP across crate boundaries without changing floating-point semantics.
[profile.release]
lto = "thin"
codegen-units = 1

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
daw-separation = { path = "crates/separation" }
daw-saturator = { path = "crates/saturator" }
daw-bitcrusher = { path = "crates/bitcrusher" }
daw-stereo-spread = { path = "crates/stereo-spread" }
daw-direction-mixer = { path = "crates/direction-mixer" }
daw-sampler = { path = "crates/sampler" }
daw-macro = { path = "crates/macro" }
daw-lfo = { path = "crates/lfo" }
daw-amplitude = { path = "crates/amplitude" }
timestretch = { path = "crates/timestretch" }
daw-unit-core = { path = "crates/unit-core", version = "0.1.0" }
daw-oscillator = { path = "crates/oscillator" }
daw-envelope = { path = "crates/envelope" }
daw-equalizer = { path = "crates/equalizer" }
daw-drive = { path = "crates/drive" }
daw-filter = { path = "crates/filter" }
daw-auto-filter = { path = "crates/auto-filter" }
daw-compressor = { path = "crates/compressor" }
daw-limiter = { path = "crates/limiter" }
daw-ott = { path = "crates/ott" }
fundsp = { version = "0.23", default-features = false, features = ["std"] }
daw-core = { path = "crates/core" }
daw-media = { path = "crates/media" }
daw-engine = { path = "crates/engine" }
daw-project = { path = "crates/project" }
daw-output = { path = "crates/output" }
daw-ui = { path = "crates/ui" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
uuid = { version = "1.23", features = ["v4", "serde"] }
thiserror = "2.0"
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "mp3", "aac", "isomp4"] }
hound = "3.5"
rubato = "0.16"
rtrb = "0.3"
cpal = "0.16"
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "accesskit", "persistence"] }
egui = "0.36.2"
rfd = "0.15"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Keep Charon's public ort API, but use checksum-pinned native 1.31 artifacts.
# This upstream revision includes the Loop/Scan model-load validation fix.
[patch.crates-io]
ort-sys = { git = "https://github.com/pykeio/ort", rev = "f2a5f73c9dd9ff3682303481cc792bf4669e3e94" }

# Provider-policy compatibility patch; upstream processing is retained unchanged.
[patch."https://github.com/Valkyra-Labs/charon-audio"]
charon-audio = { path = "vendor/charon-audio" }
