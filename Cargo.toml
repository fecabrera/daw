[workspace]
resolver = "3"
members = ["crates/core", "crates/media", "crates/engine", "crates/project", "crates/output", "crates/ui", "apps/desktop", "apps/cli"]
default-members = ["apps/desktop", "apps/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
daw-core = { path = "crates/core" }
daw-media = { path = "crates/media" }
daw-engine = { path = "crates/engine" }
daw-project = { path = "crates/project" }
daw-output = { path = "crates/output" }
daw-ui = { path = "crates/ui" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.23", features = ["v4", "serde"] }
thiserror = "2.0"
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm"] }
hound = "3.5"
rubato = "0.16"
rtrb = "0.3"
cpal = "0.16"
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "accesskit"] }
egui = "0.36.2"
rfd = "0.15"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
