[package]
name = "daw-ott-vst3"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "BSD-2-Clause"
publish = false

[lib]
path = "../drive-vst3/src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
allocation-check = []

[dependencies]
daw-drive-editor = { package = "daw-ott-editor", path = "../../crates/ott-editor" }
daw-plugin-window.workspace = true
daw-drive-plugin = { package = "daw-ott-plugin", path = "../../crates/ott-plugin" }
daw-plugin-vst3.workspace = true

[dev-dependencies]
daw-ott.workspace = true
daw-unit-core.workspace = true
libloading.workspace = true
serde_json.workspace = true
