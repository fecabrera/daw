[package]
name = "daw-harmonic-lift-clap"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "BSD-2-Clause"
publish = false

[features]
allocation-check = []

[lib]
path = "../drive-clap/src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
daw-drive-editor = { package = "daw-harmonic-lift-editor", path = "../../crates/harmonic-lift-editor" }
daw-plugin-window.workspace = true
rtrb.workspace = true
daw-drive-plugin = { package = "daw-harmonic-lift-plugin", path = "../../crates/harmonic-lift-plugin" }
daw-plugin-clap.workspace = true

[dev-dependencies]
serde_json.workspace = true
libloading.workspace = true
daw-harmonic-lift.workspace = true
daw-unit-core.workspace = true
