[package]
name = "daw-ambient-reverb-auv2"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
build = "../drive-auv2/build.rs"

[lib]
path = "../drive-auv2/src/lib.rs"
crate-type = ["cdylib", "rlib"]

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
daw-drive-plugin = { package = "daw-ambient-reverb-plugin", path = "../../crates/ambient-reverb-plugin" }
daw-drive-editor = { package = "daw-ambient-reverb-editor", path = "../../crates/ambient-reverb-editor" }
daw-plugin-auv2.workspace = true
daw-plugin-window.workspace = true
daw-plugin-support.workspace = true

[target.'cfg(target_os = "macos")'.build-dependencies]
cc.workspace = true
toml_edit.workspace = true
