name: Platform test and build

on:
  workflow_call:
    inputs:
      platform:
        description: Platform label for jobs and summaries.
        required: true
        type: string
      runner:
        description: Native GitHub-hosted runner label.
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  test:
    name: Test
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        id: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare log directory
        run: |
          mkdir -p work/ci-logs
          printf 'Runner: %s / %s\nCommit: %s\n' "$RUNNER_OS" "$RUNNER_ARCH" "$GITHUB_SHA" > work/ci-logs/runner.log

      - name: Reduce Linux test build disk usage
        if: runner.os == 'Linux'
        run: |
          printf '%s\n' \
            'CARGO_PROFILE_TEST_DEBUG=line-tables-only' \
            'CARGO_PROFILE_DEV_DEBUG=line-tables-only' \
            'CARGO_INCREMENTAL=0' >> "$GITHUB_ENV"

      - name: Set up native build
        id: setup
        uses: ./.github/actions/setup-build

      - name: Install Nextest 0.9.152
        id: nextest_setup
        run: |
          version=0.9.152
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64)
              target=x86_64-unknown-linux-gnu
              checksum=d039b43c3e0958441b6ad0a39c8884d018b3d2e8fb9928f209074b1100b5e17a
              ;;
            macOS-ARM64)
              target=universal-apple-darwin
              checksum=2fadf57df4243e691f088ee3bff4f4ab9af16da0c95a1db84b5cb1685e098a76
              ;;
            Windows-X64)
              target=x86_64-pc-windows-msvc
              checksum=0384fc89a5a547d4fd5e183fcc101d31dba2837feafd8e64d5ea003a0ddb1941
              ;;
            *) printf 'Unsupported Nextest runner %s-%s\n' "$RUNNER_OS" "$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          install_dir="$RUNNER_TEMP/nextest"
          mkdir -p "$install_dir"
          cd "$install_dir"
          archive="cargo-nextest-$version-$target.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$version/$archive" \
            --output "$archive"
          if [[ "$RUNNER_OS" == macOS ]]; then
            printf '%s  %s\n' "$checksum" "$archive" | shasum -a 256 -c -
          else
            printf '%s  %s\n' "$checksum" "$archive" | sha256sum -c -
          fi
          tar -xzf "$archive"
          if [[ "$RUNNER_OS" == Windows ]]; then
            install_dir="$(cygpath -aw "$install_dir")"
          fi
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

      - name: Log Linux disk usage after setup
        if: runner.os == 'Linux'
        run: bash tools/capture_ci_log.sh work/ci-logs/disk-usage.log bash tools/log_ci_disk_usage.sh "After setup"

      - name: Check formatting
        id: formatting
        run: |
          mkdir -p work/ci-logs
          bash tools/capture_ci_log.sh work/ci-logs/formatting.log cargo fmt --all --check

      - name: Check Clippy
        id: clippy
        run: bash tools/capture_ci_log.sh work/ci-logs/clippy.log cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        id: tests
        run: |
          cargo nextest --version
          bash tools/capture_ci_log.sh work/ci-logs/tests.log \
            cargo nextest run --locked --workspace --cargo-profile test --no-fail-fast \
            -E 'not test(=native::tests::native_audio_component_registration_and_host_calls)'

      - name: Check native Audio Unit registration
        id: au_registration
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        run: |
          bash tools/capture_ci_log.sh work/ci-logs/au-registration.log \
            cargo nextest run --locked --workspace --cargo-profile test --no-fail-fast \
            --test-threads 1 --no-tests=fail \
            -E 'test(=native::tests::native_audio_component_registration_and_host_calls)'

      - name: Run workspace doctests
        id: doctests
        run: bash tools/capture_ci_log.sh work/ci-logs/doctests.log cargo test --locked --workspace --doc

      - name: Log Linux disk usage after workspace tests
        if: runner.os == 'Linux'
        run: bash tools/capture_ci_log.sh --append work/ci-logs/disk-usage.log bash tools/log_ci_disk_usage.sh "After workspace tests and doctests"

      - name: Check Linux GTK window modes
        id: gtk_window
        if: runner.os == 'Linux'
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          GTK_A11Y: none
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          bash tools/capture_ci_log.sh work/ci-logs/gtk-window.log dbus-run-session -- xvfb-run -a cargo run --locked -p daw-desktop -- --smoke-test
          cargo run --locked -p daw-desktop -- --font-license > work/ci-logs/font-license.log

      - name: Check external plugin hosting with owned fixtures
        id: plugin_hosting
        run: |
          bash tools/capture_ci_log.sh work/ci-logs/hosting-build.log cargo build --locked -p daw-desktop -p daw-cli -p daw-plugin-host-fixtures -p daw-plugin-scan -p daw-drive-clap -p daw-drive-vst3
          bash tools/capture_ci_log.sh --append work/ci-logs/hosting-build.log cargo build --locked -p daw-engine --example native_fixture_check -p daw-plugin-host --example native_host_check --example native_preset_check
          # The graph matrix fingerprints the full debug bundle on every load.
          bash tools/capture_ci_log.sh --append work/ci-logs/hosting-build.log cargo build --locked --profile test -p daw-engine --example native_graph_check
          bash tools/capture_ci_log.sh work/ci-logs/hosting-fixtures.log python tools/check_plugin_hosting.py
          bash tools/capture_ci_log.sh work/ci-logs/hosting-embedded-desktop.log python tools/check_plugin_scanner.py --embedded --scanner target/debug/daw-desktop${{ runner.os == 'Windows' && '.exe' || '' }}
          bash tools/capture_ci_log.sh work/ci-logs/hosting-embedded-cli.log python tools/check_plugin_scanner.py --embedded --scanner target/debug/daw-cli${{ runner.os == 'Windows' && '.exe' || '' }}
          bash tools/capture_ci_log.sh work/ci-logs/hosting-drive.log python tools/check_plugin_scanner.py --host-check target/debug/examples/native_host_check${{ runner.os == 'Windows' && '.exe' || '' }} --graph-check target/debug/examples/native_graph_check${{ runner.os == 'Windows' && '.exe' || '' }}

      - name: Check Intel macOS targets
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        run: |
          rustup target add x86_64-apple-darwin
          bash tools/capture_ci_log.sh work/ci-logs/intel-check.log cargo check --locked --workspace --all-targets --target x86_64-apple-darwin

      - name: Log Linux disk usage before CLI smoke checks
        if: runner.os == 'Linux'
        run: bash tools/capture_ci_log.sh --append work/ci-logs/disk-usage.log bash tools/log_ci_disk_usage.sh "Before headless CLI"

      - name: Check the headless CLI
        id: cli
        # Plugin hosting already built the native debug CLI that check_cli.py expects.
        run: bash tools/capture_ci_log.sh work/ci-logs/cli.log python tools/check_cli.py

      - name: Log final Linux disk usage
        if: always() && runner.os == 'Linux' && steps.nextest_setup.outcome == 'success'
        run: bash tools/capture_ci_log.sh --append work/ci-logs/disk-usage.log bash tools/log_ci_disk_usage.sh "Before log upload"

      - name: Upload test logs
        id: logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-test-${{ runner.os }}-${{ runner.arch }}
          path: work/ci-logs/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Write test summary
        if: always() && steps.checkout.outcome == 'success'
        env:
          CI_STEP_RESULTS: ${{ toJSON(steps) }}
          CI_JOB_LABEL: ${{ github.job }} / ${{ inputs.platform }}
          CI_JOB_STATUS: ${{ job.status }}
        run: python tools/summarize_ci.py

  build:
    name: Build
    needs: test
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        id: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare log directory
        run: |
          mkdir -p work/ci-logs
          printf 'Runner: %s / %s\nCommit: %s\n' "$RUNNER_OS" "$RUNNER_ARCH" "$GITHUB_SHA" > work/ci-logs/runner.log

      - name: Set up native build
        id: setup
        uses: ./.github/actions/setup-build

      - name: Package Windows executable and licenses
        id: windows_package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path work/ci-logs -Force | Out-Null
          ./tools/package_windows.ps1 release *>&1 | Tee-Object -FilePath work/ci-logs/package.log
          Expand-Archive -LiteralPath target/release/DAW.zip -DestinationPath target/release/windows-artifact -Force

      - name: Package macOS disk image
        id: macos_package
        if: runner.os == 'macOS'
        run: |
          mkdir -p work/ci-logs
          bash tools/capture_ci_log.sh work/ci-logs/package.log sh tools/package_macos_dmg.sh release

      - name: Package Linux ZIP
        id: linux_package
        if: runner.os == 'Linux'
        run: |
          mkdir -p work/ci-logs
          bash tools/capture_ci_log.sh work/ci-logs/package.log sh tools/package_linux.sh release

      - name: Upload Windows executable and licenses
        id: windows_artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: DAW-windows-x64
          path: target/release/windows-artifact/DAW/
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS disk image
        id: macos_artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          path: target/release/DAW-macos-arm64.dmg
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux ZIP
        id: linux_artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          path: target/release/DAW-linux-x64.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        id: logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-build-${{ runner.os }}-${{ runner.arch }}
          path: work/ci-logs/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Write build summary
        if: always() && steps.checkout.outcome == 'success'
        env:
          CI_STEP_RESULTS: ${{ toJSON(steps) }}
          CI_JOB_LABEL: ${{ github.job }} / ${{ inputs.platform }}
          CI_JOB_STATUS: ${{ job.status }}
        run: python tools/summarize_ci.py
