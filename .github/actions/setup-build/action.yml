name: Set up native build
description: Configure native dependencies, the pinned Rust toolchain, Python, and Cargo caching.
runs:
  using: composite
  steps:
    - name: Set up Python for toolchain and CLI checks
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Install Linux build dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config clang libclang-dev \
          autoconf automake libtool libasound2-dev libudev-dev libx11-dev \
          libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev \
          libgl1-mesa-dev libwayland-dev libxkbcommon-dev zip

    - name: Configure Windows C++ tools
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Select the MSVC linker
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $linker = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64\link.exe'
        if (-not (Test-Path -LiteralPath $linker)) {
          throw 'The Windows runner is missing the MSVC x64 linker.'
        }
        "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" >> $env:GITHUB_ENV
        Write-Output "MSVC linker: $linker"

    - name: Configure Windows libclang
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $clangDirectory = Join-Path $env:ProgramFiles 'LLVM\bin'
        if (-not (Test-Path (Join-Path $clangDirectory 'libclang.dll'))) {
          throw 'The Windows runner is missing LLVM libclang.dll.'
        }
        "LIBCLANG_PATH=$clangDirectory" >> $env:GITHUB_ENV

    - name: Configure macOS libclang
      if: runner.os == 'macOS'
      shell: bash
      run: |
        clang_directory="$(dirname "$(xcrun --find clang)")"
        library_directory="$(cd "$clang_directory/../lib" && pwd)"
        test -f "$library_directory/libclang.dylib"
        echo "LIBCLANG_PATH=$library_directory" >> "$GITHUB_ENV"

    - name: Install the repository Rust toolchain
      shell: bash
      run: |
        toolchain="$(python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
        rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
        rustup show active-toolchain

    - name: Cache Cargo dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
