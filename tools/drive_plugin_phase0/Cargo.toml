[package]
name = "drive-plugin-phase0"
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "BSD-2-Clause"
publish = false

# This feasibility tool is intentionally independent of the DAW workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "drive-baseline"
path = "src/baseline.rs"

[dependencies]
daw-drive = { path = "../../crates/drive" }
daw-unit-core = { path = "../../crates/unit-core" }
egui = { version = "=0.36.2", features = ["default_fonts"] }
nice-plug = { version = "=0.4.2", default-features = false, features = ["editor", "vst3"] }
nice-plug-egui = { version = "=0.5.0", default-features = false, features = ["opengl"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
