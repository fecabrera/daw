[package]
name = "daw-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
daw-ui.workspace = true
eframe.workspace = true
wgpu = { version = "30", default-features = false, features = ["std", "metal", "dx12", "vulkan", "gles", "wgsl"] }
egui.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSMenu", "NSMenuItem", "NSEvent", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject", "NSString"] }
raw-window-handle = "0.6.2"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6.2"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6.2"
x11-dl = "2.21"
