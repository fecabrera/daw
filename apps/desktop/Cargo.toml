[package]
name = "daw-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# Compatibility with the former GTK experiment command; GTK is always used on Linux.
[features]
gtk-titlebar = []

[dependencies]
daw-ui.workspace = true
egui.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
eframe.workspace = true
wgpu = { version = "30", default-features = false, features = ["std", "metal", "dx12", "vulkan", "gles", "wgsl"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSMenu", "NSMenuItem", "NSCell", "NSEvent", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject", "NSString"] }
raw-window-handle = "0.6.2"

[target.'cfg(target_os = "windows")'.dependencies]
eframe = { workspace = true, features = ["glow"] }
raw-window-handle = "0.6.2"
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk4 = { version = "0.10", features = ["v4_8"] }
egui_glow = { version = "0.36.2", default-features = false }
libloading.workspace = true
ron = "0.12.2"
serde.workspace = true
serde_json.workspace = true
